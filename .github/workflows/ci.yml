# Routine tests: go vet + the full test suite on Linux and macOS.
#
# macOS is included because GNE extensions there are compiled with
# clang producing .dylib — a different dlopen path than Linux.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  security-events: write

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod (Go 1.19) still pins the language level; the toolchain
          # uses the stable release because Go 1.19 is EOL and is no
          # longer tested against the newest Xcode/clang on macOS runners.
          go-version: stable
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: Run Gosec security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: go test
        run: go test ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/coverage.out
            **/test-report.xml
          retention-days: 7
          if-no-files-found: ignore
