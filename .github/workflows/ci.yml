# Routine tests: go vet + the full test suite on Linux and macOS.
#
# macOS is included because GNE extensions there are compiled with
# clang producing .dylib — a different dlopen path than Linux.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod (Go 1.19) still pins the language level; the toolchain
          # uses the stable release because Go 1.19 is EOL and is no
          # longer tested against the newest Xcode/clang on macOS runners.
          go-version: stable
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
