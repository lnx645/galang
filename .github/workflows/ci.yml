# Uji rutin: go vet + seluruh suite test di Linux dan macOS.
#
# macOS ikut diuji karena ekstensi GNE di sana dikompilasi clang
# menghasilkan .dylib — jalur dlopen berbeda dari Linux.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod (go 1.19) tetap membatasi tingkat bahasa; toolchain
          # memakai rilis stabil karena Go 1.19 sudah EOL dan tidak lagi
          # diuji terhadap Xcode/clang terbaru di runner macOS.
          go-version: stable
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
