# macOS release assets — the only platform that CANNOT be built on the
# Linux release machine (cross-CGO to darwin is impossible), so it is
# built on runners instead:
#
#   1. gar-darwin-<arch> with CGO=1 (GNE dlopen + SQLite enabled)
#   2. extension .dylib binaries per architecture (for `make pack-ext`)
#   3. smoke test: pack + install extensions + `use` raising a controlled
#      error — proof that the GNE dlopen path really works on darwin.
#
# The `upload` job waits for the release to be created (make release-zip
# && gh release create on the release machine) then adds the darwin
# assets to that release.
name: Release macOS

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel # amd64; Intel label kept until Aug 2027
            arch: amd64
          - runner: macos-latest # arm64 (Apple Silicon)
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # Keep in sync with EXTS in the Makefile.
      EXTS: redis smtp uuid jwt httpclient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod (Go 1.19) still pins the language level; Go 1.19 is
          # EOL and no longer tested against the linker shipped with new
          # Xcode releases, so darwin binaries are built with the stable
          # toolchain the runners are tested against.
          go-version: stable
      - name: Build gar (CGO=1)
        run: CGO_ENABLED=1 go build -ldflags "-s -w -X galang/internal/delivery/cli.Version=${GITHUB_REF_NAME#v}" -o gar-darwin-${{ matrix.arch }} ./cmd/gar
      - name: Build extension .dylibs
        run: |
          set -e
          for name in $EXTS; do
            out=ext/$name/build/darwin-${{ matrix.arch }}
            mkdir -p "$out"
            clang -dynamiclib -Wall -Wextra -I include \
              -o "$out/$name.dylib" "ext/$name/$name.c"
            echo "Built extension $name → $out"
          done
      - name: Smoke test (pack + install + use)
        run: |
          set -e
          GAR="$PWD/gar-darwin-${{ matrix.arch }}"
          for name in $EXTS; do
            "$GAR" gne pack "ext/$name" -o "/tmp/$name.zip"
            "$GAR" gne install "/tmp/$name.zip"
          done
          "$GAR" gne list
          mkdir -p /tmp/smoke
          printf '%s\n' \
            'use "redis"' \
            'use "smtp"' \
            'use "uuid"' \
            'use "jwt"' \
            'use "httpclient"' \
            'try {' \
            '  $r = redis.connect("127.0.0.1", 65530, 300)' \
            '  print("unexpected")' \
            '} catch e {' \
            '  print("smoke-redis " + e.code)' \
            '}' \
            'try {' \
            '  $s = smtp.connect("127.0.0.1", 65530, 300)' \
            '  print("unexpected")' \
            '} catch e {' \
            '  print("smoke-smtp " + e.code)' \
            '}' \
            'try {' \
            '  $u = uuid.v7()' \
            '  if uuid.is_valid($u) {' \
            '    print("smoke-uuid ok")' \
            '  } else {' \
            '    print("smoke-uuid failed")' \
            '  }' \
            '} catch e {' \
            '  print("smoke-uuid " + e.code)' \
            '}' \
            'try {' \
            '  $t = jwt.sign({"sub": "smoke"}, "rahasia", "HS256")' \
            '  $c = jwt.verify($t, "rahasia")' \
            '  print("smoke-jwt ok")' \
            '} catch e {' \
            '  print("smoke-jwt " + e.code)' \
            '}' \
            'try {' \
            '  $h = httpclient.get("http://127.0.0.1:65530/")' \
            '  print("unexpected")' \
            '} catch e {' \
            '  print("smoke-httpclient " + e.code)' \
            '}' \
            > /tmp/smoke/main.ga
          cd /tmp/smoke
          out=$("$GAR" run main.ga)
          echo "$out"
          echo "$out" | grep -q 'smoke-redis redis_error'
          echo "$out" | grep -q 'smoke-smtp smtp_error'
          echo "$out" | grep -q 'smoke-uuid ok'
          echo "$out" | grep -q 'smoke-jwt ok'
          echo "$out" | grep -q 'smoke-httpclient httpclient_error'
          echo "smoke test passed on darwin/${{ matrix.arch }}"
      - name: Prepare zip assets
        run: |
          set -e
          cp include/gne.h .
          zip -q gar-darwin-${{ matrix.arch }}.zip gar-darwin-${{ matrix.arch }} gne.h
          paths=""
          for name in $EXTS; do paths="$paths ext/$name/build"; done
          zip -qr ext-dylib-${{ matrix.arch }}.zip $paths
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            gar-darwin-${{ matrix.arch }}.zip
            ext-dylib-${{ matrix.arch }}.zip
          retention-days: 30
          if-no-files-found: error

  upload:
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      # Keep in sync with EXTS in the Makefile.
      EXTS: redis smtp uuid jwt httpclient
    steps:
      - name: Download macOS build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Merge .dylib binaries from both architectures
        run: |
          set -e
          unzip -q ext-dylib-amd64.zip
          unzip -q ext-dylib-arm64.zip
          paths=""
          for name in $EXTS; do paths="$paths ext/$name/build"; done
          zip -qr ext-darwin-builds.zip $paths
          unzip -l ext-darwin-builds.zip
      - name: Wait for release then upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot infer the repository
          # from git remotes — GH_REPO is required for gh release
          # view/upload to work (without it the wait loop timed out
          # after 20 minutes).
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # The release is created from the release machine
          # (make release-zip && gh release create) — wait up to 20 minutes.
          ok=0
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 30
          done
          if [ "$ok" != 1 ]; then
            echo "release $GITHUB_REF_NAME still not created after 20 minutes" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" \
            gar-darwin-amd64.zip gar-darwin-arm64.zip ext-darwin-builds.zip --clobber
