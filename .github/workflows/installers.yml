# Platform installers — built from release assets that already exist:
#
#   Windows : GaLang-Setup-<v>.exe   Inno Setup 6; x64 + Windows on ARM
#                                     (x64 emulation); adds {app} to PATH;
#                                     silent-tested: install →
#                                     gar version → uninstall.
#   Linux   : galang_<v>_<arch>.deb  amd64 + arm64 → /usr/bin/gar;
#             tested with dpkg -i → gar version → dpkg -r on the runner.
#   macOS   : GaLang-<v>-macos.pkg   universal2 (lipo) → /usr/local/bin/gar;
#             tested with sudo installer → gar version.
#
# Triggers: release published (automatic for the next release — binary
# assets may be uploaded concurrently, so downloads retry for up to 20
# minutes) and workflow_dispatch(tag) to add installers to an older
# release.
name: Platform Installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v0.6.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Installer tooling is checked out from the default branch
          # (binary assets come from the release, not this checkout —
          # older tags may not contain the packaging/ folder yet).
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch release binary gar-windows-amd64
        shell: pwsh
        run: |
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/gar-windows-amd64.zip"
          $ok = $false
          for ($i = 1; $i -le 40; $i++) {
            & curl.exe -fsSL -o gar-windows-amd64.zip $url
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "attempt $i failed; retrying in 30 seconds"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { throw "asset gar-windows-amd64.zip did not appear within 20 minutes" }
          Expand-Archive gar-windows-amd64.zip -DestinationPath bin
          Copy-Item bin/gar-windows-amd64.exe packaging/windows/gar.exe

      - name: Set up Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found: $iscc" }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Rebuild gar.exe from source (prevents stale zip mismatch)
        shell: pwsh
        run: |
          $ver = $env:TAG -replace '^v',''
          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"
          go build -ldflags "-s -w -X galang/internal/delivery/cli.Version=$ver" -o packaging/windows/gar.exe ./cmd/gar
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          & packaging/windows/gar.exe version

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = $env:TAG -replace '^v',''
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          Push-Location packaging/windows
          & $iscc "/DMyAppVersion=$ver" galang.iss
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "ISCC failed (code $rc)" }
          Get-Item "packaging/windows/out/GaLang-Setup-$ver.exe" |
            Format-List Name, Length

      - name: Silent test — install, run, uninstall
        shell: pwsh
        run: |
          $ver = $env:TAG -replace '^v',''
          $setup = "$PWD\packaging\windows\out\GaLang-Setup-$ver.exe"
          Start-Process -Wait -FilePath $setup `
            -ArgumentList '/SP-','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $gar = "${env:ProgramFiles}\GaLang\gar.exe"
          if (-not (Test-Path $gar)) { throw "gar.exe was not installed at $gar" }
          $out = & $gar version
          Write-Host "installed: $out"
          if ("$out" -notmatch [regex]::Escape($ver)) {
            throw "version mismatch: '$out' vs '$ver'"
          }
          $mPath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($mPath -notlike "*\GaLang*") { throw "machine PATH does not contain the GaLang folder" }
          Start-Process -Wait -FilePath "${env:ProgramFiles}\GaLang\unins000.exe" `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          if (Test-Path $gar) { throw "uninstall did not remove gar.exe" }
          $mPath2 = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($mPath2 -like "*\GaLang*") { throw "PATH still contains the GaLang entry" }
          Write-Host "silent test passed (install + PATH + uninstall)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: packaging/windows/out/GaLang-Setup-*.exe
          retention-days: 30
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch release binaries (amd64 + arm64)
        run: |
          set -e
          for p in gar-linux-amd64.zip gar-linux-arm64.zip; do
            ok=0
            for i in $(seq 1 40); do
              if curl -fsSL -o "$p" \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$p"; then
                ok=1; break
              fi
              echo "attempt $i ($p) failed; retrying in 30 seconds"
              sleep 30
            done
            if [ "$ok" != 1 ]; then
              echo "asset $p did not appear within 20 minutes" >&2; exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Rebuild gar from source (prevents stale zip mismatch)
        run: |
          set -e
          VER="${TAG#v}"
          CGO_ENABLED=1 go build -ldflags "-s -w -X galang/internal/delivery/cli.Version=$VER" -o gar-linux-amd64 ./cmd/gar
          # arm64 cross-build needs gcc-aarch64-linux-gnu on the runner
          if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X galang/internal/delivery/cli.Version=$VER" -o gar-linux-arm64 ./cmd/gar
            echo "arm64 built via cross-compiler"
          else
            echo "no cross-compiler; arm64 from release asset"
            unzip -q gar-linux-arm64.zip -d bin-arm64
            cp bin-arm64/gar-linux-arm64 ./ || cp bin-arm64/gar ./ || true
            test -f gar-linux-arm64 || { echo "arm64 asset unavailable"; exit 1; }
          fi
          ./gar-linux-amd64 version

      - name: Build .deb for both architectures
        run: |
          set -e
          VER="${TAG#v}"
          ./packaging/linux/build-deb.sh "$VER" amd64 gar-linux-amd64 deb
          ./packaging/linux/build-deb.sh "$VER" arm64 gar-linux-arm64 deb
          ls -l deb/

      - name: Test package install (amd64)
        run: |
          set -e
          VER="${TAG#v}"
          sudo dpkg -i "deb/galang_${VER}_amd64.deb"
          out=$(/usr/bin/gar version)
          echo "$out"
          case "$out" in
            *"$VER"*) ;;
            *) echo "version mismatch: '$out' vs '$VER'" >&2; exit 1 ;;
          esac
          sudo dpkg -r galang
          test ! -f /usr/bin/gar
          echo "dpkg test passed (install + run + remove)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: deb/*.deb
          retention-days: 30
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch release binaries darwin (amd64 + arm64)
        run: |
          set -e
          for p in gar-darwin-amd64.zip gar-darwin-arm64.zip; do
            ok=0
            for i in $(seq 1 40); do
              if curl -fsSL -o "$p" \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$p"; then
                ok=1; break
              fi
              echo "attempt $i ($p) failed; retrying in 30 seconds"
              sleep 30
            done
            if [ "$ok" != 1 ]; then
              echo "asset $p did not appear within 20 minutes" >&2; exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Rebuild darwin binaries from source (prevents stale zip mismatch)
        run: |
          set -e
          VER="${TAG#v}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X galang/internal/delivery/cli.Version=$VER" -o gar-darwin-amd64 ./cmd/gar
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X galang/internal/delivery/cli.Version=$VER" -o gar-darwin-arm64 ./cmd/gar
          ./gar-darwin-amd64 version

      - name: Build universal2 .pkg
        run: |
          set -e
          VER="${TAG#v}"
          ./packaging/macos/build-pkg.sh "$VER" \
            gar-darwin-amd64 gar-darwin-arm64 \
            "pkg/GaLang-$VER-macos.pkg"

      - name: Test pkg install
        run: |
          set -e
          VER="${TAG#v}"
          sudo installer -pkg "pkg/GaLang-$VER-macos.pkg" -target /
          out=$(/usr/local/bin/gar version)
          echo "$out"
          case "$out" in
            *"$VER"*) ;;
            *) echo "version mismatch: '$out' vs '$VER'" >&2; exit 1 ;;
          esac
          echo "pkg test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: pkg/*.pkg
          retention-days: 30
          if-no-files-found: error

  upload:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job has no checkout — GH_REPO is required so gh knows the
      # target repository (lesson learned from the release.yml upload
      # job that used to time out).
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload installers to the release
        run: |
          set -e
          VER="${TAG#v}"
          ls -la
          gh release upload "$TAG" \
            "GaLang-Setup-$VER.exe" \
            "galang_${VER}_amd64.deb" \
            "galang_${VER}_arm64.deb" \
            "GaLang-$VER-macos.pkg" \
            --clobber
